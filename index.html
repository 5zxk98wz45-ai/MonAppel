<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MonAppel</title>
<meta name="theme-color" content="#10151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MonAppel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', -apple-system, system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #10151f; color: #e4e6ec; overflow: hidden; }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* --- Auth --- */
  #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 16px; gap: 14px; text-align: center; background: radial-gradient(circle at 30% 20%, #1c2436, #10151f 70%); }
  #auth-screen h1 { font-size: 30px; margin-bottom: 4px; font-weight: 800; background: linear-gradient(90deg,#22d3ee,#a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.5px; }
  #auth-box { background: #1a2233; padding: 26px; border-radius: 20px; width: 100%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.5); border: 1px solid #2a3550; }
  #auth-box input { width: 100%; padding: 12px 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #2a3550; background: #10151f; color: white; font-size: 16px; }
  #auth-box button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(90deg,#22d3ee,#818cf8); color: #0b0f18; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 4px; }
  #auth-toggle { color: #8b93a7; font-size: 13px; margin-top: 12px; cursor: pointer; }
  #auth-toggle b { color: #22d3ee; }
  #auth-error { color: #ff7a6e; font-size: 13px; min-height: 18px; }

  /* --- App --- */
  #app { display: flex; height: 100vh; }

  #server-rail { width: 68px; background: #131a28; display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 10px; flex-shrink: 0; overflow-y: auto; }
  .server-icon, .add-icon {
    width: 46px; height: 46px; border-radius: 14px; background: #202a3f; color: #e4e6ec;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
    cursor: pointer; transition: transform .12s, box-shadow .12s; text-transform: uppercase; flex-shrink: 0;
  }
  .server-icon:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(34,211,238,.3); }
  .server-icon.active { background: linear-gradient(135deg,#22d3ee,#818cf8); color: #0b0f18; }
  .add-icon { background: transparent; border: 2px dashed #3a4766; font-size: 18px; color: #8b93a7; }
  .add-icon:hover { border-color: #22d3ee; color: #22d3ee; }

  #mid-column { width: 210px; background: #151d2c; display: flex; flex-direction: column; flex-shrink: 0; }
  #server-title { padding: 14px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #232e45; }

  #channel-list-wrap { padding: 10px; }
  #channel-list-wrap h3, #contacts-wrap h3 { font-size: 11px; text-transform: uppercase; color: #7480a0; margin: 6px 4px; display: flex; justify-content: space-between; align-items: center; letter-spacing: .04em; }
  .small-add-btn { background: none; border: none; color: #7480a0; font-size: 16px; cursor: pointer; padding: 0 4px; }
  #channel-list { list-style: none; padding: 0; margin: 0; }
  #channel-list li { padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; color: #9aa3ba; margin-bottom: 3px; }
  #channel-list li:hover { background: #202a3f; color: #e4e6ec; }
  #channel-list li.active { background: linear-gradient(90deg,#1d3f4a,#2a2a52); color: white; }

  #user-list-wrap { padding: 10px; overflow-y: auto; flex: 1; min-height: 0; }
  #user-list { list-style: none; padding: 0; margin: 0; }
  #user-list li, #contact-list li { display: flex; align-items: center; gap: 8px; padding: 7px; border-radius: 10px; margin-bottom: 3px; font-size: 14px; }
  #contact-list li { cursor: pointer; }
  #contact-list li:hover { background: #202a3f; }
  .avatar { width: 28px; height: 28px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 700; flex-shrink: 0; background-position: center; background-size: cover; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-left: auto; }
  .dot.online { background: #34d399; } .dot.offline { background: #4b5670; }

  #contacts-wrap { padding: 10px; border-top: 1px solid #232e45; }
  #add-contact-row { display: flex; gap: 4px; margin-bottom: 6px; }
  #add-contact-input { flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid #2a3550; background: #10151f; color: white; font-size: 14px; min-width: 0; }
  #add-contact-btn { padding: 8px 12px; border: none; border-radius: 10px; background: #7c5cff; color: white; cursor: pointer; font-size: 13px; font-weight: 600; }
  #contact-list { list-style: none; padding: 0; margin: 0; max-height: 120px; overflow-y: auto; }

  #call-bar { padding: 10px; border-top: 1px solid #232e45; }
  #call-bar button { width: 100%; padding: 11px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; }
  #join-call-btn { background: linear-gradient(90deg,#34d399,#22d3ee); color: #0b0f18; }
  #leave-call-btn { background: #ff5c73; color: white; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main-header { padding: 12px 16px; border-bottom: 1px solid #232e45; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #main-header .dm-call-btn { background: linear-gradient(90deg,#34d399,#22d3ee); color: #0b0f18; border: none; border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-weight: 700; }
  #server-code-tag { font-size: 11px; color: #7480a0; font-weight: 400; cursor: pointer; background: #202a3f; padding: 3px 8px; border-radius: 8px; }
  #no-channel { flex: 1; display: flex; align-items: center; justify-content: center; color: #4b5670; padding: 20px; text-align: center; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 12px; display: flex; gap: 10px; }
  .msg .avatar { width: 32px; height: 32px; }
  .msg .content .pseudo { font-weight: 700; font-size: 14px; margin-right: 6px; color: #22d3ee; }
  .msg .content .text { font-size: 14px; word-break: break-word; }
  .system-msg { color: #7480a0; font-style: italic; font-size: 13px; margin-bottom: 6px; }
  .error-msg { color: #ff7a6e; font-size: 13px; margin-bottom: 6px; }

  #chat-form { display: flex; gap: 8px; padding: 14px; flex-shrink: 0; }
  #chat-input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1px solid #2a3550; background: #1a2233; color: white; font-size: 16px; min-width: 0; }
  #chat-form button { padding: 10px 18px; border: none; border-radius: 14px; background: linear-gradient(90deg,#22d3ee,#818cf8); color: #0b0f18; cursor: pointer; font-weight: 700; }

  #call-panel { position: fixed; top: 8px; right: 8px; left: 8px; max-width: 420px; margin-left: auto; background: #0b0f18; padding: 12px; border-radius: 18px; z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,.6); border: 1px solid #2a3550; display: flex; flex-direction: column; }
  #call-panel.full { top: 0; right: 0; bottom: 0; left: 0; max-width: none; margin: 0; border-radius: 0; border: none; }
  #call-panel.minimized { left: -10000px; right: auto; top: 0; width: 320px; opacity: 0; pointer-events: none; }
  #videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; margin-bottom: 10px; }
  #videos-grid video { width: 100%; border-radius: 12px; background: #000; display: block; aspect-ratio: 4/3; object-fit: cover; }
  #call-panel.full #videos-grid { flex: 1; min-height: 0; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); grid-auto-rows: 1fr; margin-bottom: 12px; }
  #call-panel.full #videos-grid video { height: 100%; min-height: 0; aspect-ratio: auto; object-fit: contain; }
  #call-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #call-controls button { min-width: 46px; height: 46px; border: none; border-radius: 14px; cursor: pointer; font-size: 18px; background: #202a3f; color: white; display: flex; align-items: center; justify-content: center; }
  #call-controls button.off { background: #ff5c73; }
  #call-controls button.active { background: linear-gradient(90deg,#22d3ee,#818cf8); }
  #call-controls #hangup-btn { background: #ff5c73; padding: 0 16px; font-size: 14px; font-weight: 700; }
  #return-call-pill { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 45; background: linear-gradient(90deg,#34d399,#22d3ee); color: #0b0f18; border: none; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a2233; border: 1px solid #2a3550; padding: 10px 16px; border-radius: 12px; z-index: 100; font-size: 13px; max-width: 90%; text-align: center; }

  /* --- Mon compte --- */
  #my-account { display: flex; align-items: center; gap: 8px; padding: 10px; border-top: 1px solid #232e45; cursor: pointer; }
  #my-account:hover { background: #202a3f; }
  #my-account .avatar { width: 34px; height: 34px; font-size: 13px; }
  #my-account span { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #requests-wrap { padding: 8px 10px; }
  #requests-wrap h3 { font-size: 11px; text-transform: uppercase; color: #7480a0; margin: 6px 4px; }
  .request-row { display: flex; align-items: center; gap: 6px; padding: 7px; font-size: 13px; background: #202a3f; border-radius: 10px; margin-bottom: 4px; }
  .request-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .request-row button { border: none; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: white; font-weight: 700; }
  .req-accept { background: #34d399; color: #0b0f18; } .req-decline { background: #ff5c73; }
  .pending-tag { font-size: 11px; color: #7480a0; font-style: italic; }

  /* --- Modales --- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(6,9,15,.7); display: flex; align-items: center; justify-content: center; z-index: 30; }
  .modal-box { background: #1a2233; padding: 22px; border-radius: 18px; width: 270px; border: 1px solid #2a3550; }
  .modal-box h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-box input { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #2a3550; background: #10151f; color: white; margin-bottom: 10px; font-size: 16px; }
  .modal-box .row { display: flex; gap: 8px; }
  .modal-box button { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; }
  .modal-confirm { background: linear-gradient(90deg,#22d3ee,#818cf8); color: #0b0f18; }
  .modal-cancel { background: #2a3550; color: #e4e6ec; }
  .profile-avatar-preview { width: 84px; height: 84px; border-radius: 20px; background: #10151f; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; background-position: center; background-size: cover; }
  .modal-box input[type=file] { font-size: 13px; color: #e4e6ec; }

  @media (max-width: 560px) {
    #mid-column { width: 135px; }
    #server-rail { width: 54px; }
    .server-icon, .add-icon { width: 38px; height: 38px; font-size: 11px; }
  }
</style>
</head>
<body>

  <div id="auth-screen">
    <h1>MonAppel</h1>
    <div id="auth-box">
      <input id="pseudo-input" placeholder="Pseudo" maxlength="20" autocomplete="username">
      <input id="password-input" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <div id="auth-error"></div>
      <button id="auth-submit-btn">Se connecter</button>
      <div id="auth-toggle">Pas de compte ? <b>Inscris-toi</b></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div id="server-rail"></div>

    <div id="mid-column">
      <div id="server-title">Choisis ou crée un serveur</div>

      <div id="channel-list-wrap">
        <h3>Salons <button class="small-add-btn" id="add-channel-btn">＋</button></h3>
        <ul id="channel-list"></ul>
      </div>

      <div id="user-list-wrap">
        <h3>En ligne ici</h3>
        <ul id="user-list"></ul>
      </div>

      <div id="requests-wrap" class="hidden">
        <h3>Demandes reçues</h3>
        <div id="request-list"></div>
      </div>

      <div id="contacts-wrap">
        <h3>Amis</h3>
        <div id="add-contact-row">
          <input id="add-contact-input" placeholder="Pseudo...">
          <button id="add-contact-btn">Ajouter</button>
        </div>
        <ul id="contact-list"></ul>
      </div>

      <div id="call-bar">
        <button id="join-call-btn" class="hidden">🎙️ Rejoindre l'appel</button>
        <button id="leave-call-btn" class="hidden">📞 Quitter l'appel</button>
      </div>

      <div id="my-account">
        <div class="avatar" id="my-avatar-mini">?</div>
        <span id="my-account-name"></span>
      </div>
    </div>

    <div id="main">
      <div id="main-header" class="hidden">
        <span id="main-header-label"></span>
        <button class="dm-call-btn hidden" id="dm-call-btn">📞 Appeler</button>
      </div>
      <div id="no-channel">Sélectionne ou crée un serveur, puis un salon, pour discuter — ou clique sur un ami pour lui écrire en privé.</div>
      <div id="chat-messages" class="hidden"></div>
      <form id="chat-form" class="hidden">
        <input id="chat-input" placeholder="Écris un message..." autocomplete="off">
        <button type="submit">Envoyer</button>
      </form>
    </div>
  </div>

  <div id="call-panel" class="hidden">
    <div id="videos-grid"></div>
    <div id="call-controls">
      <button id="mic-btn" title="Couper / activer le micro">🎤</button>
      <button id="cam-btn" title="Couper / activer la caméra">📷</button>
      <button id="screen-btn" title="Partager l'écran">🖥️</button>
      <button id="size-btn" title="Agrandir">⤢</button>
      <button id="hide-btn" title="Masquer l'appel (il continue)">➖</button>
      <button id="hangup-btn" title="Raccrocher">Raccrocher</button>
    </div>
  </div>
  <button id="return-call-pill" class="hidden">🎙️ Appel en cours · Retour</button>
  <div id="toast" class="hidden"></div>

  <div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const SERVER_URL = 'https://mondiscord.onrender.com';
  const socket = io(SERVER_URL);

  // --- DOM ---
  const authScreen = document.getElementById('auth-screen');
  const pseudoInput = document.getElementById('pseudo-input');
  const passwordInput = document.getElementById('password-input');
  const authError = document.getElementById('auth-error');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const authToggle = document.getElementById('auth-toggle');

  const app = document.getElementById('app');
  const serverRail = document.getElementById('server-rail');
  const serverTitle = document.getElementById('server-title');
  const channelList = document.getElementById('channel-list');
  const addChannelBtn = document.getElementById('add-channel-btn');
  const userListEl = document.getElementById('user-list');
  const addContactInput = document.getElementById('add-contact-input');
  const addContactBtn = document.getElementById('add-contact-btn');
  const contactListEl = document.getElementById('contact-list');
  const requestsWrap = document.getElementById('requests-wrap');
  const requestListEl = document.getElementById('request-list');
  const myAccountBtn = document.getElementById('my-account');
  const myAvatarMini = document.getElementById('my-avatar-mini');
  const myAccountName = document.getElementById('my-account-name');

  const noChannelEl = document.getElementById('no-channel');
  const mainHeader = document.getElementById('main-header');
  const mainHeaderLabel = document.getElementById('main-header-label');
  const dmCallBtn = document.getElementById('dm-call-btn');
  const chatMessages = document.getElementById('chat-messages');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');

  const joinCallBtn = document.getElementById('join-call-btn');
  const leaveCallBtn = document.getElementById('leave-call-btn');
  const callPanel = document.getElementById('call-panel');
  const videosGrid = document.getElementById('videos-grid');
  const hangupBtn = document.getElementById('hangup-btn');
  const micBtn = document.getElementById('mic-btn');
  const camBtn = document.getElementById('cam-btn');
  const screenBtn = document.getElementById('screen-btn');
  const sizeBtn = document.getElementById('size-btn');
  const hideBtn = document.getElementById('hide-btn');
  const returnPill = document.getElementById('return-call-pill');
  const modalRoot = document.getElementById('modal-root');

  let mode = 'login';
  let myPseudo = '';
  let allServers = [];
  let currentServerId = null;
  let currentChannelId = null;
  let activeContext = null; // { type: 'channel'|'dm', id }
  let currentDMPartner = null;
  let inCall = false;
  let localStream = null;
  const peerConnections = {};       // appel de groupe (mesh) : socketId -> RTCPeerConnection
  let directPC = null;              // appel direct 1-à-1 avec un contact
  let directLocalStream = null;
  let directPartnerId = null;
  let pendingDirectOffer = null;
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  let myFriendsData = { friends: [], incoming: [], outgoing: [] };
  let myAvatar = null;

  function colorFor(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return `hsl(${Math.abs(hash) % 360}, 60%, 45%)`;
  }

  // --- Avatars (photo si dispo, sinon initiales colorées) ---
  const avatarCache = {};
  let avatarQueue = new Set();
  let avatarTimer = null;
  function cssEscapePseudo(p) { return (window.CSS && CSS.escape) ? CSS.escape(p) : p.replace(/["\\]/g, '\\$&'); }
  function applyAvatarToDom(pseudo) {
    const url = avatarCache[pseudo];
    document.querySelectorAll(`.avatar[data-pseudo="${cssEscapePseudo(pseudo)}"]`).forEach((el) => {
      if (url) { el.style.backgroundImage = `url(${url})`; el.textContent = ''; }
      else { el.style.backgroundImage = ''; el.style.background = colorFor(pseudo); el.textContent = pseudo.slice(0, 2).toUpperCase(); }
    });
  }
  function ensureAvatarLoaded(pseudo) {
    if (pseudo in avatarCache) { applyAvatarToDom(pseudo); return; }
    avatarQueue.add(pseudo);
    if (!avatarTimer) {
      avatarTimer = setTimeout(() => {
        const list = Array.from(avatarQueue); avatarQueue.clear(); avatarTimer = null;
        socket.emit('get-avatars', list, (map) => {
          Object.assign(avatarCache, map || {});
          list.forEach((p) => applyAvatarToDom(p));
        });
      }, 150);
    }
  }
  function avatarEl(pseudo) {
    const div = document.createElement('div');
    div.className = 'avatar';
    div.dataset.pseudo = pseudo;
    div.style.background = colorFor(pseudo);
    div.textContent = pseudo.slice(0, 2).toUpperCase();
    ensureAvatarLoaded(pseudo);
    return div;
  }
  function showMessage(text, cls) {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // --- Petite modale texte réutilisable ---
  function promptModal(title, placeholder, onConfirm) {
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <h3>${title}</h3>
          <input id="modal-input" placeholder="${placeholder}" maxlength="30">
          <div class="row">
            <button class="modal-cancel" id="modal-cancel">Annuler</button>
            <button class="modal-confirm" id="modal-confirm">OK</button>
          </div>
        </div>
      </div>`;
    const input = document.getElementById('modal-input');
    input.focus();
    document.getElementById('modal-cancel').onclick = () => modalRoot.innerHTML = '';
    const confirm = () => {
      const val = input.value.trim();
      if (!val) return;
      modalRoot.innerHTML = '';
      onConfirm(val);
    };
    document.getElementById('modal-confirm').onclick = confirm;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirm(); });
  }

  // --- Auth ---
  authToggle.onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    authSubmitBtn.textContent = mode === 'login' ? 'Se connecter' : "S'inscrire";
    authToggle.innerHTML = mode === 'login' ? "Pas de compte ? <b>Inscris-toi</b>" : "Déjà un compte ? <b>Connecte-toi</b>";
    authError.textContent = '';
  };

  authSubmitBtn.onclick = () => {
    const pseudo = pseudoInput.value.trim();
    const password = passwordInput.value;
    if (!pseudo || !password) { authError.textContent = 'Remplis les deux champs.'; return; }
    authError.textContent = '';
    socket.emit(mode, { pseudo, password }, (res) => {
      if (!res.ok) { authError.textContent = res.error; return; }
      if (mode === 'register') {
        authError.style.color = '#23a55a';
        authError.textContent = 'Compte créé ! Connecte-toi maintenant.';
        setTimeout(() => authError.style.color = '#f23f42', 10);
        mode = 'login';
        authSubmitBtn.textContent = 'Se connecter';
        authToggle.innerHTML = "Pas de compte ? <b>Inscris-toi</b>";
        return;
      }
      myPseudo = pseudo;
      localStorage.setItem('mondiscord-session', JSON.stringify({ pseudo, password }));
      authScreen.classList.add('hidden');
      app.classList.remove('hidden');
      myAccountName.textContent = myPseudo;
      socket.emit('join', myPseudo);
    });
  };
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') authSubmitBtn.click(); });

  // --- Reconnexion automatique si une session est enregistrée sur cet appareil ---
  function tryAutoLogin() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem('mondiscord-session') || 'null'); } catch { saved = null; }
    if (!saved || !saved.pseudo || !saved.password) return;

  // ============================================================

  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(text) {

    toastEl.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 3800);

  let callViewMode = 'mini';      // 'mini' | 'full' | 'minimized'
  let lastVisibleMode = 'mini';
  let screenStream = null;
  let callChannelKey = null;      // salon dans lequel on est en appel de groupe
  let pendingDirectCandidates = [];  // candidats ICE en attente (appelant, avant de connaître l'autre)
  let earlyDirectCandidates = [];    // candidats ICE reçus avant d'avoir accepté l'appel

  function isCallActive() { return inCall || !!directPC; }
  function getActiveLocalStream() { return localStream || directLocalStream; }

  function updateCallUI() {

  // --- Partage d'écran ---
  function setOutgoingVideoTrack(track) {
    const pcs = Object.values(peerConnections);
    if (directPC) pcs.push(directPC);
    pcs.forEach((pc) => {
      const tr = pc.getTransceivers().find((t) => t.receiver && t.receiver.track && t.receiver.track.kind === 'video');
      if (tr && tr.sender) tr.sender.replaceTrack(track).catch(() => {});
    });
  }
  function applyScreenToPC(pc) {
    if (!screenStream) return;
    const tr = pc.getTransceivers().find((t) => t.receiver && t.receiver.track && t.receiver.track.kind === 'video');
    if (tr && tr.sender) tr.sender.replaceTrack(screenStream.getVideoTracks()[0]).catch(() => {});
  }
  async function startScreenShare() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      toast("Le partage d'écran n'est pas disponible sur ce téléphone/navigateur (iPhone notamment). Essaie depuis un ordinateur.");
      return;
    }
    try { screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true }); }
    catch { screenStream = null; return; }
    const track = screenStream.getVideoTracks()[0];
    setOutgoingVideoTrack(track);
    const tile = document.getElementById('video-local');
    if (tile) tile.srcObject = screenStream;
    track.onended = () => stopScreenShare();
    screenBtn.classList.add('active');
  }
  function stopScreenShare() {
    if (!screenStream) return;
    const s = screenStream; screenStream = null;
    s.getTracks().forEach((t) => { t.onended = null; t.stop(); });
    const cam = getActiveLocalStream();
    const camTrack = cam ? (cam.getVideoTracks()[0] || null) : null;
    setOutgoingVideoTrack(camTrack);
    const tile = document.getElementById('video-local');
    if (tile && cam) tile.srcObject = cam;
    screenBtn.classList.remove('active');
  }
  screenBtn.onclick = () => {
    if (!isCallActive()) return;
    if (screenStream) stopScreenShare(); else startScreenShare();
  };

  // --- Utilitaires WebRTC ---
  async function getLocalMedia() {
    try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); }
    catch {
      try { toast('Caméra indisponible, appel en audio seul.'); return await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); }
      catch (e) { toast("Impossible d'accéder au micro/caméra. Vérifie les autorisations."); throw e; }
    }
  }
  function addVideoTile(id, stream, isLocal) {
    let video = document.getElementById('video-' + id);
    if (!video) {
      video = document.createElement('video');
      video.id = 'video-' + id; video.autoplay = true; video.playsInline = true;
      if (isLocal) video.muted = true;
      videosGrid.appendChild(video);
    }
    video.srcObject = stream;
  }
  function removeVideoTile(id) { const v = document.getElementById('video-' + id); if (v) v.remove(); }

  // Ajoute les pistes locales + une ligne vidéo "vide" si on est en audio seul (pour pouvoir partager l'écran ensuite)
  function attachLocalTracks(pc, stream) {
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    if (stream.getVideoTracks().length === 0) pc.addTransceiver('video', { direction: 'sendrecv' });
    applyScreenToPC(pc);
  }
  // Les candidats ICE reçus trop tôt (avant la description distante) sont mis en file d'attente
  async function addCandidateSafe(pc, candidate) {
    if (pc.remoteDescription) { try { await pc.addIceCandidate(candidate); } catch {} }
    else { (pc._queued = pc._queued || []).push(candidate); }
  }
  async function flushCandidates(pc) {
    const q = pc._queued || []; pc._queued = [];
    for (const c of q) { try { await pc.addIceCandidate(c); } catch {} }
  }

  // ============================================================
  //  Appel de groupe (mesh) dans un salon
  // ============================================================
  function createPeerConnection(remoteId) {
    const pc = new RTCPeerConnection(rtcConfig);
    attachLocalTracks(pc, localStream);
    pc.ontrack = (e) => addVideoTile(remoteId, e.streams[0], false);
    pc.onicecandidate = (e) => { if (e.candidate) socket.emit('ice-candidate', { to: remoteId, candidate: e.candidate }); };
    peerConnections[remoteId] = pc;
    return pc;
  }

  joinCallBtn.onclick = async () => {
    try { localStream = await getLocalMedia(); } catch { return; }
    inCall = true;
    callChannelKey = `${currentServerId}:${currentChannelId}`;
    resetCallControls();
    joinCallBtn.classList.add('hidden');
    leaveCallBtn.classList.remove('hidden');
    addVideoTile('local', localStream, true);
    updateCallUI();
    socket.emit('join-call');
  };

  socket.on('existing-call-peers', async (peers) => {
    for (const { id } of peers) {
      const pc = createPeerConnection(id);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('call-offer', { to: id, offer });
    }
  });
  socket.on('call-offer', async ({ from, offer }) => {
    if (!inCall) return;
    const pc = createPeerConnection(from);
    await pc.setRemoteDescription(offer);
    await flushCandidates(pc);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('call-answer', { to: from, answer });
  });
  socket.on('call-answer', async ({ from, answer }) => {
    const pc = peerConnections[from];
    if (pc) { await pc.setRemoteDescription(answer); await flushCandidates(pc); }
  });
  socket.on('ice-candidate', async ({ from, candidate }) => {
    const pc = peerConnections[from];
    if (pc) await addCandidateSafe(pc, candidate);
  });
  socket.on('call-peer-left', ({ id }) => {
    if (peerConnections[id]) { peerConnections[id].close(); delete peerConnections[id]; }
    removeVideoTile(id);
  });

  function leaveCall() {
    socket.emit('leave-call');
    Object.values(peerConnections).forEach((pc) => pc.close());
    Object.keys(peerConnections).forEach((id) => delete peerConnections[id]);
    videosGrid.innerHTML = '';
    if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
    inCall = false;
    callChannelKey = null;
    if (currentChannelId) joinCallBtn.classList.remove('hidden');
    leaveCallBtn.classList.add('hidden');
    cleanupCallControls();
  }
  leaveCallBtn.onclick = leaveCall;

  // ============================================================
  //  Appel privé 1-à-1 avec un ami
  // ============================================================
  async function startDirectCall(targetPseudo) {
    if (directPC || inCall) { toast('Un appel est déjà en cours.'); return; }
    try { directLocalStream = await getLocalMedia(); } catch { return; }
    resetCallControls();
    addVideoTile('local', directLocalStream, true);
    pendingDirectCandidates = [];
    directPartnerId = null;

    directPC = new RTCPeerConnection(rtcConfig);
    attachLocalTracks(directPC, directLocalStream);
    directPC.ontrack = (e) => addVideoTile('remote', e.streams[0], false);
    directPC.onicecandidate = (e) => {
      if (!e.candidate) return;
      if (directPartnerId) socket.emit('direct-ice-candidate', { to: directPartnerId, candidate: e.candidate });
      else pendingDirectCandidates.push(e.candidate);
    };
    updateCallUI();

    const offer = await directPC.createOffer();
    await directPC.setLocalDescription(offer);
    socket.emit('direct-call-user', { toPseudo: targetPseudo, offer }, (res) => {
      if (!res || !res.ok) {
        toast(`${targetPseudo} n'est plus en ligne.`);
        endDirectCall();
        return;
      }
      directPartnerId = res.targetId;
      pendingDirectCandidates.forEach((c) => socket.emit('direct-ice-candidate', { to: directPartnerId, candidate: c }));
      pendingDirectCandidates = [];
    });
  }

  socket.on('direct-incoming-call', ({ from, offer, pseudo }) => {
    if (directPC || inCall) { socket.emit('direct-end-call', { to: from }); return; }
    pendingDirectOffer = { from, offer };
    earlyDirectCandidates = [];
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <h3>Appel entrant de ${pseudo}</h3>
          <div class="row">
            <button class="modal-cancel" id="reject-direct">Refuser</button>
            <button class="modal-confirm" id="accept-direct">Accepter</button>
          </div>
        </div>
      </div>`;
    document.getElementById('reject-direct').onclick = () => {
      modalRoot.innerHTML = '';
      socket.emit('direct-end-call', { to: from });
      pendingDirectOffer = null; earlyDirectCandidates = [];
    };
    document.getElementById('accept-direct').onclick = async () => {
      modalRoot.innerHTML = '';
      if (!pendingDirectOffer) return;
      const remoteOffer = pendingDirectOffer.offer;
      directPartnerId = from;
      try { directLocalStream = await getLocalMedia(); }
      catch { pendingDirectOffer = null; earlyDirectCandidates = []; directPartnerId = null; socket.emit('direct-end-call', { to: from }); return; }
      resetCallControls();
      addVideoTile('local', directLocalStream, true);

      directPC = new RTCPeerConnection(rtcConfig);
      attachLocalTracks(directPC, directLocalStream);
      directPC.ontrack = (e) => addVideoTile('remote', e.streams[0], false);
      directPC.onicecandidate = (e) => { if (e.candidate) socket.emit('direct-ice-candidate', { to: from, candidate: e.candidate }); };
      updateCallUI();

      await directPC.setRemoteDescription(remoteOffer);
      for (const c of earlyDirectCandidates) { try { await directPC.addIceCandidate(c); } catch {} }
      earlyDirectCandidates = [];
      const answer = await directPC.createAnswer();
      await directPC.setLocalDescription(answer);
      socket.emit('direct-answer-call', { to: from, answer });
      pendingDirectOffer = null;
    };
  });
  socket.on('direct-call-answered', async ({ answer }) => {
    if (directPC) { await directPC.setRemoteDescription(answer); await flushCandidates(directPC); }
  });
  socket.on('direct-ice-candidate', async ({ candidate }) => {
    if (directPC) await addCandidateSafe(directPC, candidate);
    else if (pendingDirectOffer) earlyDirectCandidates.push(candidate);
  });
  socket.on('direct-call-ended', () => {
    // Si l'appel entrant n'avait pas encore été décroché, on ferme la fenêtre "Appel entrant"
    if (pendingDirectOffer) { modalRoot.innerHTML = ''; pendingDirectOffer = null; earlyDirectCandidates = []; }
    endDirectCall();
  });

  function endDirectCall() {
    if (directPC) { directPC.close(); directPC = null; }
    if (directLocalStream) { directLocalStream.getTracks().forEach((t) => t.stop()); directLocalStream = null; }
    removeVideoTile('remote');
    if (!inCall) removeVideoTile('local');
    directPartnerId = null;
    pendingDirectCandidates = [];
    cleanupCallControls();
  }

  // --- Raccrocher (prévient l'autre personne AVANT de couper) ---
  function hangUp() {
    if (directPartnerId) socket.emit('direct-end-call', { to: directPartnerId });
    if (inCall) leaveCall();
    if (directPC) endDirectCall();
  }
  hangupBtn.onclick = hangUp;
</script>
</body>
</html>
